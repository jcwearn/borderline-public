name: CI

# Calls the shared Node CI workflow in jcwearn/workflows. The six universal
# steps and the reasoning behind them moved there unchanged.
#
# The bespoke half of this repo's CI -- the browser-driven layout suite and the
# generated-data drift check -- moved to ci-extras.yml rather than staying here
# or becoming inputs on the shared workflow. That is a speedup, not a
# concession: as a separate workflow it runs in PARALLEL with this one instead
# of extending a serial job, so total wall clock is now the slower of the two
# rather than their sum.
#
# The local `concurrency:` block is deliberately gone rather than moved up: the
# shared workflow declares its own, and two groups for one logical run means
# the outer one holds a slot while the inner one queues behind it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    # Explicit even though `read` is all node-ci needs and all this account
    # grants by default. A reusable workflow can only narrow what the caller
    # granted, so the grant belongs here where it is visible.
    permissions:
      contents: read
    # Renovate pins this to a digest on its next run, leaving `# v1` behind as
    # the record of what to follow. Written as `@v1` with no trailing comment;
    # the comment belongs on a digest, where it records which tag it came from.
    uses: jcwearn/workflows/.github/workflows/node-ci.yaml@6f55467302f6f95c7f42ca20346274a256aebaea # v1
    with:
      # puppeteer's postinstall downloads a Chrome build during `npm ci`. This
      # job never launches a browser -- the layout suite lives in
      # ci-extras.yml -- so that download is pure latency at best, and at worst
      # it is what it was on 2026-08-15: a 403 from Google's
      # chrome-for-testing bucket failed `npm ci` outright, on a PR that only
      # repinned a workflow ref.
      #
      # package.json's allowScripts block is supposed to block that postinstall,
      # and usually does. It is not reliable: the same commit failed with the
      # script running, then passed on a bare re-run with npm reporting it
      # skipped as "not yet covered by allowScripts". This env var does not
      # depend on that policy engaging.
      #
      # Safe for ci-extras.yml too, which sets it and still installs Chrome:
      # PUPPETEER_SKIP_DOWNLOAD is only consulted by the postinstall path and
      # by `puppeteer browsers install` with NO browser argument. Given an
      # explicit `chrome`, the CLI installs unconditionally
      # (@puppeteer/browsers CLI.js -- the guard is `if (pinnedBrowsers &&
      # !args.browser)`). Verified both ways before relying on it.
      extra-env: PUPPETEER_SKIP_DOWNLOAD=1
