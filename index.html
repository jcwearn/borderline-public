<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="apple-mobile-web-app-title" content="Borderline" />
    <meta
      name="description"
      content="Cross the world in as few countries as possible. A daily land-border puzzle, scored like golf."
    />
    <title>Borderline</title>
    <link rel="canonical" href="https://borderline.golf/" />

    <!--
      The share card. Every URL here is absolute on purpose: a relative og:image
      is the usual reason a link pastes into iMessage as a blank rectangle.
      public/og.png is built by `npm run build:og`.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Borderline" />
    <meta property="og:url" content="https://borderline.golf/" />
    <meta property="og:title" content="Borderline — a daily land-border puzzle" />
    <meta
      property="og:description"
      content="Cross the world in as few countries as possible. A daily land-border puzzle, scored like golf."
    />
    <meta property="og:image" content="https://borderline.golf/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A globe over the Mediterranean, with a half-finished route lit from Portugal to Saudi Arabia."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Borderline — a daily land-border puzzle" />
    <meta
      name="twitter:description"
      content="Cross the world in as few countries as possible. A daily land-border puzzle, scored like golf."
    />
    <meta name="twitter:image" content="https://borderline.golf/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
